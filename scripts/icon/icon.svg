<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="58%" cy="30%" r="90%">
      <stop offset="0%"   stop-color="#1c1722"/>
      <stop offset="50%"  stop-color="#0c0b0f"/>
      <stop offset="100%" stop-color="#070709"/>
    </radialGradient>
    <!-- dreamy Pink/Coral Bloom oben rechts, groß & weich (wie .bloom der App) -->
    <radialGradient id="bloom" cx="72%" cy="20%" r="66%">
      <stop offset="0%"   stop-color="#ff8ec2" stop-opacity="0.60"/>
      <stop offset="34%"  stop-color="#ff7fa8" stop-opacity="0.26"/>
      <stop offset="62%"  stop-color="#ff7e5a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff7e5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="30%" y1="4%" x2="70%" y2="96%">
      <stop offset="0%"   stop-color="#ffa9cb"/>
      <stop offset="42%"  stop-color="#ff86b9"/>
      <stop offset="100%" stop-color="#ff6f4c"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#bloom)"/>

  <!-- warmer Halo hinter dem Blitz -->
  <path d="M296 78 L176 286 L250 286 L216 434 L336 232 L262 232 Z"
        fill="#ff7e6a" opacity="0.60" filter="url(#glow)"/>
  <!-- Blitz -->
  <path d="M296 78 L176 286 L250 286 L216 434 L336 232 L262 232 Z"
        fill="url(#bolt)" stroke="#ffe0ec" stroke-width="1.6" stroke-opacity="0.30"
        stroke-linejoin="round"/>
</svg>
