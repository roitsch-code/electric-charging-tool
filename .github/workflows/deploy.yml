name: Deploy to server

# Jeder Merge/Push auf main deployt automatisch. Zusätzlich manuell auslösbar
# über den "Run workflow"-Knopf (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prüfen ob Deploy-Secrets gesetzt sind
        id: cfg
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Keine Deploy-Secrets gesetzt — Deploy wird übersprungen (Setup noch offen)."
          fi
      - name: Deploy über SSH
        if: steps.cfg.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: /opt/ladeplanner/deploy.sh
