[global]

# Aussen EINFACHE Anfuehrungszeichen, innen doppelte: so braucht es keine
# Backslash-Escapes in der INI (die ofelias Parser fuer unquotete Werte NICHT
# aufloest — der Header kaeme dann zerlegt bei curl an und der Aufruf liefe
# ins Leere). $CRON_SECRET expandiert die Shell IM Container.
# Kein -f: bei 401/500 soll der Antwort-Body im ofelia-Log stehen, sonst ist
# ein abgewiesener Cron nicht von einem stillen zu unterscheiden.

# Realtime-Verfuegbarkeit pollen (nur relevant, falls spaeter ein DB-Status-
# Poller genutzt wird; die On-demand-Belegung via TomTom braucht das nicht).
[job-exec "poll-realtime"]
schedule = @every 5m
container = ladeplanner-app
command = sh -c 'curl -sS -H "Authorization: Bearer $CRON_SECRET" http://localhost:3000/api/cron/poll'

# Faellige Push-Benachrichtigungen verschicken (Minutentakt, Konzept §6).
# Macht in einem Lauf beides: Ankunfts-Push und Ueberwachung der Saeule.
[job-exec "dispatch-push"]
schedule = @every 1m
container = ladeplanner-app
command = sh -c 'curl -sS -H "Authorization: Bearer $CRON_SECRET" http://localhost:3000/api/cron/dispatch'
