[global]

# Realtime-Verfuegbarkeit pollen (nur relevant, falls spaeter ein DB-Status-
# Poller genutzt wird; die On-demand-Belegung via TomTom braucht das nicht).
[job-exec "poll-realtime"]
schedule = @every 5m
container = ladeplanner-app
command = sh -c "curl -sf http://localhost:3000/api/cron/poll -H \"Authorization: Bearer $CRON_SECRET\""

# Faellige Push-Benachrichtigungen verschicken (Minutentakt, Konzept §6).
[job-exec "dispatch-push"]
schedule = @every 1m
container = ladeplanner-app
command = sh -c "curl -sf http://localhost:3000/api/cron/dispatch -H \"Authorization: Bearer $CRON_SECRET\""
